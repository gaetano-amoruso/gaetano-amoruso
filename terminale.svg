<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Gaetano Amoruso, sviluppatore web. Stack: PHP, JavaScript, HTML/CSS, SCSS, Python, SQL, WordPress, WooCommerce, Bootstrap, GitHub Actions">
<style>
.c{fill-opacity:0;animation:on .01s linear forwards}
.o{opacity:0;animation:show .25s ease-out forwards}
.cur{opacity:0;animation:blink 1.06s steps(1) infinite}
@keyframes on{from,to{fill-opacity:1}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.c{animation:none;fill-opacity:1}.o{animation:none;opacity:1}.cur{animation:none;opacity:1}}
text{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:32px}
</style>
<defs>
