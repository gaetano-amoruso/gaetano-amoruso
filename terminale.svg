<radialGradient id="tl" cx=".92" cy="1" r=".6"><stop offset="0" stop-color="#2BD0F0" stop-opacity=".35"/><stop offset="1" stop-color="#2BD0F0" stop-opacity="0"/></radialGradient>
<radialGradient id="hl" cx=".1" cy="0" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121531"/><stop offset="1" stop-color="#090A18"/></linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3FA4"/><stop offset=".5" stop-color="#B565E8"/><stop offset="1" stop-color="#2BD0F0"/></linearGradient>
<pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#fff" opacity=".035"/></pattern>
